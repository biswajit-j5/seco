<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Provider profile · Seco</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="index.html">Seco</a>
    <div class="navlinks"><a href="services.html">Find services</a><a href="login.html">Sign in</a></div>
  </nav>
  <main class="container provider-profile-page">
    <a class="back-link" href="services.html">← All professionals</a>
    <div id="profile-content" class="empty-state">Loading provider profile…</div>
  </main>

  <script>
    const providerId = new URLSearchParams(location.search).get('id');
    const requestedService = new URLSearchParams(location.search).get('service_id');
    const profileContent = document.querySelector('#profile-content');

    async function loadProfile() {
      if (!providerId) {
        profileContent.innerHTML = '<div class="empty-state"><strong>Provider not found.</strong><a href="services.html">Browse professionals</a></div>';
        return;
      }
      try {
        const [provider, allServices, reviews] = await Promise.all([
          api.get(`/providers/${providerId}`),
          api.get('/services/?limit=100'),
          api.get(`/providers/${providerId}/reviews`)
        ]);
        const services = allServices.items.filter(service => service.provider_id === provider.provider_id);
        if (!services.length) throw new Error('This provider has no active services yet.');
        renderProfile(provider, services, reviews);
      } catch (error) {
        profileContent.innerHTML = `<div class="empty-state"><strong>Couldn’t load this profile.</strong><span>${escapeHtml(error.message)}</span><a href="services.html">Back to professionals</a></div>`;
      }
    }

    function renderProfile(provider, services, reviews) {
      const selected = services.find(service => String(service.service_id) === requestedService) || services[0];
      const initials = provider.business_name.split(/\s+/).slice(0, 2).map(part => part[0]).join('').toUpperCase();
      const cover = 'https://images.unsplash.com/photo-1621905251918-48416bd8575a?auto=format&fit=crop&w=1400&q=85';
      const rating = Number(provider.rating) > 0 ? Number(provider.rating).toFixed(1) : 'New';
      const recentReviews = reviews.length ? reviews.map(review => `
        <article class="review-item">
          <div class="review-item-head"><strong>${escapeHtml(review.customer_name)}</strong><span>★ ${review.rating} · ${new Date(review.created_at).toLocaleDateString()}</span></div>
          <p>${escapeHtml(review.comment || 'Customer left a rating without a comment.')}</p>
        </article>
      `).join('') : '<p class="muted">No customer reviews yet. Ratings appear after completed bookings.</p>';

      profileContent.innerHTML = `
        <section class="profile-hero">
          <img src="${cover}" alt="Home service work">
          <div class="profile-identity">
            <div class="provider-avatar large" aria-hidden="true">${escapeHtml(initials)}</div>
            <div><span class="eyebrow">Verified local professional</span><h1>${escapeHtml(provider.business_name)}</h1><p>${escapeHtml(provider.city || 'Local provider')} · ${provider.experience_years} years experience</p></div>
          </div>
        </section>
        <div class="profile-grid">
          <div class="profile-main">
            <section class="profile-section">
              <div class="rating-summary"><strong>${rating === 'New' ? 'New' : `★ ${rating}`}</strong><span>${provider.rating_count} ${provider.rating_count === 1 ? 'verified review' : 'verified reviews'}</span></div>
              <h2>About</h2><p>${escapeHtml(provider.description || 'Experienced local service professional.')}</p>
            </section>
            <section class="profile-section">
              <div class="section-head"><div><span class="eyebrow">What they do</span><h2>Services</h2></div></div>
              <div class="profile-services">${services.map(service => `
                <article class="profile-service ${service.service_id === selected.service_id ? 'selected' : ''}">
                  <div><span class="tag">${escapeHtml(service.category_name)}</span><h3>${escapeHtml(service.service_name)}</h3><p>${escapeHtml(service.description || '')}</p></div>
                  <div class="profile-service-price"><strong>${money(service.price)}</strong><span>${service.estimated_duration} min</span><a class="btn small" href="customer/book.html?service_id=${service.service_id}">Book</a></div>
                </article>
              `).join('')}</div>
            </section>
            <section class="profile-section"><div class="section-head"><div><span class="eyebrow">Customer feedback</span><h2>Ratings & reviews</h2></div></div><div class="review-list">${recentReviews}</div></section>
          </div>
          <aside class="profile-aside">
            <div class="booking-box">
              <span class="eyebrow">Selected service</span><h2>${escapeHtml(selected.service_name)}</h2>
              <p class="profile-starting-price">${money(selected.price)}</p><p class="muted">${selected.estimated_duration} minutes · Flexible scheduling</p>
              <a class="btn" href="customer/book.html?service_id=${selected.service_id}">Request a booking</a>
            </div>
            <div class="rating-detail"><h3>Rating overview</h3>${[5,4,3,2,1].map(star => { const count=reviews.filter(review=>review.rating===star).length; const width=reviews.length?Math.round(count/reviews.length*100):0; return `<div class="rating-row"><span>${star} ★</span><span class="rating-track"><span style="width:${width}%"></span></span><span>${count}</span></div>`; }).join('')}</div>
          </aside>
        </div>
      `;
    }

    loadProfile();
  </script>
</body>
</html>
