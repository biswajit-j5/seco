<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Service details · Seco</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="index.html">Seco</a>
    <a href="services.html">← All services</a>
  </nav>
  <main class="container">
    <div id="details" class="detail-shell">Loading…</div>
  </main>

  <script>
    const id = new URLSearchParams(location.search).get('id');
    const fallback = {
      service_id: id || 101,
      service_name: 'Home electrician',
      category_name: 'Electrical',
      description: 'Quick, safe electrical support for homes and small businesses.',
      estimated_duration: 90,
      price: 899,
      provider: {
        business_name: 'VoltFix Solutions',
        description: 'Trusted local partners with quick turnaround and clear quotes.',
        city: 'Pune',
        experience_years: 7,
        rating: 4.8
      },
      image: 'https://images.unsplash.com/photo-1621905251918-48416bd8575a?auto=format&fit=crop&w=900&q=80'
    };

    api.get(`/services/${id}`).then(async s => {
      renderDetails(s);
      try {
        const reviews = await api.get(`/providers/${s.provider_id}/reviews`);
        const reviewBlock = document.querySelector('#reviews');
        reviewBlock.innerHTML = reviews.length ? '<h3>Recent reviews</h3>' + reviews.map(r => `<p>★ ${r.rating} — ${escapeHtml(r.comment)}</p>`).join('') : '<p class="muted">No reviews yet.</p>';
      } catch {};
    }).catch(() => renderDetails(fallback));

    function renderDetails(s) {
      const target = document.querySelector('#details');
      target.innerHTML = `
        <article class="detail-card">
          <div class="detail-image-wrap">
            <img src="${s.image || 'https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=900&q=80'}" alt="${escapeHtml(s.service_name)}">
          </div>
          <div class="detail-content">
            <span class="tag">${escapeHtml(s.category_name || 'General')}</span>
            <h1>${escapeHtml(s.service_name)}</h1>
            <p>${escapeHtml(s.description || 'Professional local service tailored to your needs.')}</p>

            <div class="detail-grid">
              <section>
                <h2>Provider</h2>
                <h3>${escapeHtml(s.provider.business_name)}</h3>
                <p>${escapeHtml(s.provider.description || 'Experienced local professional ready to help.')}</p>
                <p class="muted">${escapeHtml(s.provider.city)} · ${s.provider.experience_years || 5} years experience · ★ ${s.provider.rating || 4.8}</p>
                <div id="reviews"></div>
              </section>

              <aside class="card booking-box">
                <span class="eyebrow">Starting price</span>
                <p class="price">${money(s.price || 899)}</p>
                <p class="muted">Estimated time: ${s.estimated_duration || 90} minutes</p>
                <a id="book" class="btn" href="login.html">Book this service</a>
              </aside>
            </div>
          </div>
        </article>
      `;

      const bookButton = document.querySelector('#book');
      bookButton.onclick = async (e) => {
        try {
          const u = await api.get('/auth/me');
          if (u.role !== 'customer') {
            alert('Please sign in with a customer account to book.');
            return;
          }
          e.currentTarget.href = 'customer/dashboard.html';
        } catch {
          e.preventDefault();
          location.href = 'login.html';
        }
      };
    }
  </script>
</body>
</html>
