<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Find services · Seco</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
  <script src="js/autocomplete.js"></script>
  <script src="js/locations.js"></script>
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="index.html">Seco</a>
    <div class="navlinks">
      <a href="login.html">Sign in</a>
      <a class="btn" href="register.html">Get started</a>
    </div>
  </nav>

  <main class="container search-page">
    <div class="page-header">
      <div>
        <span class="eyebrow">Local professionals</span>
        <h1>Find your pro</h1>
        <p id="results-summary" class="muted">Browse experienced local service providers.</p>
      </div>
    </div>

    <form class="searchbar wide" id="filters">
      <input name="search" placeholder="Electrician, cleaning, plumbing..." aria-label="Search by service">
      <input name="city" placeholder="Your city" aria-label="Search by city">
      <select name="category_id">
        <option value="">All categories</option>
      </select>
      <button type="submit">Search</button>
    </form>
    <div id="results" class="provider-grid" aria-live="polite"></div>
  </main>

  <script src="js/marketplace.js"></script>
</body>
</html>
